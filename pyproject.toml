[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batchline"
version = "0.1.0"
description = "A dependency-free teaching project for inference infrastructure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
batchline = "inference_service.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
